<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Relstone</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0a0e17;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --accent: #6366f1;
  --accent-2: #8b5cf6;
  --green: #10b981;
  --red: #ef4444;
  --blue: #3b82f6;
  --text: #ffffff;
  --hint: #8b92a8;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  overflow-x: hidden;
  transition: box-shadow 0.5s;
}
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background:
    radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
  z-index: -1;
  animation: bgFloat 20s ease-in-out infinite;
}
@keyframes bgFloat {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-3%, -3%); }
}

.screen { width: 100%; max-width: 420px; margin: 0 auto; display: none; }
.screen.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.logo {
  text-align: center;
  font-size: 38px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 50%, var(--green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px;
  margin: 30px 0 6px;
}
.logo-sub {
  text-align: center;
  color: var(--hint);
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 30px;
  text-transform: uppercase;
}
.balance-card {
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 24px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.balance-label { font-size: 12px; color: var(--hint); letter-spacing: 2px; text-transform: uppercase; }
.balance {
  font-size: 42px;
  font-weight: 900;
  background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-top: 8px;
}
.menu-btns { display: flex; gap: 10px; margin-bottom: 24px; }
.menu-btn {
  flex: 1;
  padding: 16px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}
.menu-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
.menu-btn.primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  border-color: transparent;
  box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
}
.section-title {
  color: var(--hint);
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin: 24px 0 12px;
  padding-left: 8px;
}
.game-card {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: 0.2s;
}
.game-card:active { transform: scale(0.98); background: rgba(255,255,255,0.08); }
.game-icon {
  font-size: 36px;
  width: 60px; height: 60px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
  border-radius: 16px;
}
.game-info { flex: 1; }
.game-name { font-size: 17px; font-weight: 800; }
.game-desc { font-size: 13px; color: var(--hint); margin-top: 3px; }

.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.back-btn {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.top-balance {
  font-size: 18px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff, #a5b4fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.panel {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 16px;
}
.input-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.input-row label { color: var(--hint); font-size: 13px; min-width: 70px; font-weight: 600; }
.input-field {
  flex: 1;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 17px;
  font-weight: 700;
  text-align: center;
}
.input-field:focus { outline: none; border-color: var(--accent); }
.slider {
  width: 100%;
  -webkit-appearance: none;
  height: 6px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 3px;
  outline: none;
  margin: 12px 0;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 16px rgba(99, 102, 241, 0.8);
}
.slider-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--hint); margin-top: 8px; }
.slider-info b { color: #a5b4fc; }

.btn {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 16px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: white;
  box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; }
.btn.green {
  background: linear-gradient(135deg, var(--green) 0%, #059669 100%);
  box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
}
.status {
  text-align: center;
  margin: 14px 0;
  font-size: 14px;
  min-height: 20px;
  font-weight: 600;
  color: #a5b4fc;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.tile {
  aspect-ratio: 1;
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: pointer;
  transition: 0.15s;
  user-select: none;
}
.tile:active { transform: scale(0.92); }
.tile.mine {
  background: linear-gradient(135deg, rgba(239,68,68,0.3), rgba(220,38,38,0.5));
  border-color: rgba(239,68,68,0.6);
}
.tile.diamond {
  background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(99,102,241,0.5));
  border-color: rgba(59,130,246,0.6);
}
.tile.revealed-mine { opacity: 0.7; }
.tile.dimmed { opacity: 0.3; }

.card-display {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 2px solid var(--glass-border);
  border-radius: 24px;
  padding: 50px;
  text-align: center;
  font-size: 80px;
  font-weight: 900;
  background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
  filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.5));
}
.choice-row { display: flex; gap: 10px; margin-bottom: 16px; }
.choice {
  flex: 1;
  padding: 22px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  text-align: center;
  font-weight: 800;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  transition: 0.2s;
}
.choice:active { transform: scale(0.96); border-color: var(--accent); }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
  20%, 40%, 60%, 80% { transform: translateX(8px); }
}
.shake { animation: shake 0.5s; }
@keyframes flashRed {
  0% { background-color: var(--bg); }
  50% { background-color: #3a0f0f; }
  100% { background-color: var(--bg); }
}
.flash-red { animation: flashRed 0.4s; }
@keyframes flashGreen {
  0% { background-color: var(--bg); }
  50% { background-color: #0a2e1f; }
  100% { background-color: var(--bg); }
}
.flash-green { animation: flashGreen 0.4s; }
.flying-emoji {
  position: fixed;
  font-size: 32px;
  pointer-events: none;
  z-index: 9999;
  animation: flyUp 1.2s ease-out forwards;
}
@keyframes flyUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
}
@keyframes dangerPulse {
  0%, 100% { box-shadow: inset 0 0 100px rgba(239,68,68,0.2); }
  50% { box-shadow: inset 0 0 200px rgba(239,68,68,0.5); }
}
.danger-mode { animation: dangerPulse 1.5s infinite; }
.streak {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  padding: 10px 24px;
  border-radius: 20px;
  font-weight: 900;
  font-size: 18px;
  color: white;
  box-shadow: 0 8px 32px rgba(245,158,11,0.6);
  z-index: 10000;
  animation: streakPop 0.3s;
}
@keyframes streakPop {
  0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}
</style>
</head>
<body>

<div class="screen active" id="screen-menu">
  <div class="logo">RELSTONE</div>
  <div class="logo-sub">casino</div>
  <div class="balance-card">
    <div class="balance-label">Баланс</div>
    <div class="balance" id="menu-balance">0 ₽</div>
  </div>
  <div class="menu-btns">
    <button class="menu-btn primary" onclick="deposit()">💵 Пополнить</button>
    <button class="menu-btn" onclick="withdraw()">🏦 Вывести</button>
  </div>
  <div class="section-title">Игры</div>
  <div class="game-card" onclick="openGame('mines')">
    <div class="game-icon">💣</div>
    <div class="game-info">
      <div class="game-name">МИНЫ</div>
      <div class="game-desc">Открывай клетки, избегай мин</div>
    </div>
  </div>
  <div class="game-card" onclick="openGame('hl')">
    <div class="game-icon">🎴</div>
    <div class="game-info">
      <div class="game-name">БОЛЬШЕ / МЕНЬШЕ</div>
      <div class="game-desc">Угадай карту — забери всё</div>
    </div>
  </div>
</div>

<div class="screen" id="screen-mines">
  <div class="top-bar">
    <button class="back-btn" onclick="goMenu()">‹ Назад</button>
    <div class="top-balance" id="mines-balance">0 ₽</div>
  </div>
  <div class="panel">
    <div class="input-row">
      <label>Ставка</label>
      <input type="number" class="input-field" id="mines-bet-input" value="100" min="10">
    </div>
    <div class="input-row">
      <label>Мины</label>
      <input type="number" class="input-field" id="mines-count-input" value="3" min="1" max="24">
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="status" id="mines-status"></div>
  <button class="btn" id="mines-action" onclick="minesAction()">НАЧАТЬ ИГРУ</button>
</div>

<div class="screen" id="screen-hl">
  <div class="top-bar">
    <button class="back-btn" onclick="goMenu()">‹ Назад</button>
    <div class="top-balance" id="hl-balance">0 ₽</div>
  </div>
  <div class="panel">
    <div class="input-row">
      <label>Ставка</label>
      <input type="number" class="input-field" id="hl-bet-input" value="100" min="10">
    </div>
    <div style="color:var(--hint); font-size:13px; margin-bottom:6px; font-weight:600;">
      Шанс угадать: <b id="hl-chance-label" style="color:#a5b4fc;">50%</b>
    </div>
    <input type="range" class="slider" id="hl-chance" min="10" max="90" value="50" oninput="updateChance()">
    <div class="slider-info">
      <span>x1.1 (безопасно)</span>
      <span>x10 (риск)</span>
    </div>
  </div>
  <div class="card-display" id="hl-card">?</div>
  <div class="choice-row">
    <div class="choice" onclick="hlGuess('less')">⬇️ МЕНЬШЕ</div>
    <div class="choice" onclick="hlGuess('more')">⬆️ БОЛЬШЕ</div>
  </div>
  <div class="status" id="hl-status"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const API_URL = 'https://relstone-game1.onrender.com';
const userId = tg.initDataUnsafe?.user?.id || 0;

let balance = 0;

function fmt(n) { return Number(n).toLocaleString('ru-RU') + ' ₽'; }

function updateBalance() {
  document.getElementById('menu-balance').textContent = fmt(balance);
  document.getElementById('mines-balance').textContent = fmt(balance);
  document.getElementById('hl-balance').textContent = fmt(balance);
}

async function loadBalance() {
  if (!userId) { balance = 10000; updateBalance(); return; }
  try {
    const res = await fetch(`${API_URL}/api/balance/${userId}`);
    const data = await res.json();
    balance = data.balance || 0;
    updateBalance();
  } catch (e) {
    console.error(e);
    updateBalance();
  }
}

async function apiBet(amount) {
  const res = await fetch(`${API_URL}/api/bet`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, amount })
  });
  const data = await res.json();
  if (data.success) { balance = data.balance; updateBalance(); return true; }
  return false;
}

async function apiWin(amount) {
  const res = await fetch(`${API_URL}/api/win`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, amount })
  });
  const data = await res.json();
  if (data.success) { balance = data.balance; updateBalance(); }
}

async function deposit() {
  const amount = prompt('Сумма пополнения (₽):', '500');
  if (!amount) return;
  const n = parseInt(amount);
  if (isNaN(n) || n < 100) { tg.showAlert('Минимум 100 ₽'); return; }
  try {
    const res = await fetch(`${API_URL}/api/deposit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, amountRub: n })
    });
    const data = await res.json();
    if (data.payUrl) tg.openLink(data.payUrl);
    else tg.showAlert('Ошибка: ' + (data.error || 'неизвестно'));
  } catch (e) { tg.showAlert('Сервер не отвечает'); }
}

async function withdraw() {
  const amount = prompt('Сумма вывода (₽):', '500');
  if (!amount) return;
  const n = parseInt(amount);
  if (isNaN(n) || n < 100) { tg.showAlert('Минимум 100 ₽'); return; }
  if (n > balance) { tg.showAlert('Недостаточно средств'); return; }
  try {
    const res = await fetch(`${API_URL}/api/withdraw`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, amountRub: n })
    });
    const data = await res.json();
    if (data.success) {
      tg.showAlert('✅ Заявка создана!');
      loadBalance();
    } else {
      tg.showAlert(data.error || 'Ошибка');
    }
  } catch (e) { tg.showAlert('Сервер не отвечает'); }
}

function openGame(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  updateBalance();
  if (name === 'mines') buildGrid();
}

function goMenu() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-menu').classList.add('active');
  loadBalance();
}

function setStatus(game, text) {
  document.getElementById(game + '-status').textContent = text;
}

// ===== ЭФФЕКТЫ =====
function shakeScreen() {
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 500);
}
function flash(color) {
  const cls = color === 'red' ? 'flash-red' : 'flash-green';
  document.body.classList.add(cls);
  setTimeout(() => document.body.classList.remove(cls), 400);
}
function emojiBurst(emoji, count = 5, x = null, y = null) {
  const startX = x || window.innerWidth / 2;
  const startY = y || window.innerHeight / 2;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'flying-emoji';
    el.textContent = emoji;
    el.style.left = (startX + (Math.random() - 0.5) * 200) + 'px';
    el.style.top = startY + 'px';
    el.style.animationDelay = (i * 0.08) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }
}
function showStreak(count) {
  const old = document.querySelector('.streak');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'streak';
  el.textContent = `🔥 СЕРИЯ x${count}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}
function setDanger(on) {
  if (on) document.body.classList.add('danger-mode');
  else document.body.classList.remove('danger-mode');
}

// ===== МИНЫ =====
let minesActive = false;
let minesList = [];
let minesRevealed = [];
let minesCurrentWin = 0;
let minesBetAmount = 0;
let minesTotal = 0;

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.index = i;
    tile.onclick = () => clickTile(i);
    grid.appendChild(tile);
  }
}

function minesAction() {
  if (!minesActive) startMines();
  else cashoutMines();
}

async function startMines() {
  minesBetAmount = parseInt(document.getElementById('mines-bet-input').value);
  minesTotal = parseInt(document.getElementById('mines-count-input').value);

  if (isNaN(minesBetAmount) || minesBetAmount < 10) { setStatus('mines', '❌ Мин. 10 ₽'); return; }
  if (minesBetAmount > balance) { setStatus('mines', '❌ Недостаточно'); return; }
  if (isNaN(minesTotal) || minesTotal < 1 || minesTotal > 24) { setStatus('mines', '❌ 1–24 мины'); return; }

  const ok = await apiBet(minesBetAmount);
  if (!ok) { setStatus('mines', '❌ Ошибка ставки'); return; }

  minesActive = true;
  minesRevealed = [];
  minesCurrentWin = minesBetAmount;
  minesList = [];
  while (minesList.length < minesTotal) {
    const r = Math.floor(Math.random() * 25);
    if (!minesList.includes(r)) minesList.push(r);
  }
  buildGrid();
  setStatus('mines', '');
  const btn = document.getElementById('mines-action');
  btn.textContent = '💰 ЗАБРАТЬ ' + fmt(minesCurrentWin);
  btn.classList.add('green');
}

function clickTile(i) {
  if (!minesActive || minesRevealed.includes(i)) return;
  minesRevealed.push(i);
  const tile = document.querySelector(`.tile[data-index="${i}"]`);

  if (minesList.includes(i)) {
    tile.classList.add('mine');
    tile.textContent = '💣';
    minesActive = false;
    minesList.forEach(m => {
      const t = document.querySelector(`.tile[data-index="${m}"]`);
      if (t) { t.classList.add('mine'); t.textContent = '💣'; }
    });
    shakeScreen();
    flash('red');
    emojiBurst('💥', 8);
    setDanger(false);
    setStatus('mines', `💥 Проигрыш ${fmt(minesBetAmount)}`);
    const btn = document.getElementById('mines-action');
    btn.textContent = 'НАЧАТЬ ИГРУ';
    btn.classList.remove('green');
    tg.HapticFeedback.impactOccurred('heavy');
  } else {
    tile.classList.add('diamond');
    tile.textContent = '💎';
    const rect = tile.getBoundingClientRect();
    emojiBurst('💎', 3, rect.left + rect.width / 2, rect.top);
    flash('green');
    tg.HapticFeedback.impactOccurred('light');
    const multiplier = 1 + (minesTotal * 0.1);
    minesCurrentWin = Math.floor(minesCurrentWin * multiplier);
    document.getElementById('mines-action').
